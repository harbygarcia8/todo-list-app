<ion-item-sliding>
  <ion-item lines="full">
    <ion-checkbox
      slot="start"
      [checked]="task().completed"
      (ionChange)="toggled.emit()"
      [attr.aria-label]="'Marcar ' + task().title"
    ></ion-checkbox>

    <ion-label [class.task-done]="task().completed">
      <h2>{{ task().title }}</h2>
    </ion-label>

    @if (categoriesEnabled() && category(); as cat) {
      <ion-badge slot="end" class="category-badge" [style.--background]="cat.color">
        {{ cat.name }}
      </ion-badge>
    }
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option (click)="editRequested.emit()">
      <ion-icon slot="icon-only" name="create-outline"></ion-icon>
    </ion-item-option>
    @if (categoriesEnabled()) {
      <ion-item-option color="medium" (click)="categoryRequested.emit()">
        <ion-icon slot="icon-only" name="pricetag-outline"></ion-icon>
      </ion-item-option>
    }
    <ion-item-option color="danger" (click)="removed.emit()">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
